<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, user-scalable=no" />
  <title>C4 RAVEN</title>

  <!-- Icons, install metadata -->
  <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="application-name" content="C4 RAVEN" />
  <meta name="apple-mobile-web-app-title" content="C4 RAVEN" />
  <meta name="msapplication-TileColor" content="#da532c" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Apply the stored light/dark choice before the bundle loads (no dark flash in light mode). -->
  <script>
    (function () {
      var scheme = 'dark';
      try {
        if (localStorage.getItem('raven-color-scheme') === 'light') scheme = 'light';
      } catch (e) { /* storage blocked: keep dark */ }
      document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
